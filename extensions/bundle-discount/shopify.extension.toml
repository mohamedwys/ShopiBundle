api_version = "2024-10"

[[extensions]]
name = "bundle-discount"
handle = "bundle-discount"

uid = "208e9edf-8b9b-6b74-3f3a-539fdede2328f859a084"

type = "function"
description = "Validates complete bundle presence in cart before applying discount"

[extensions.build]
command = "npx tsc src/index.ts --outDir dist --module CommonJS --target ES2020 --declaration false"
path = "dist/index.js"

[[extensions.targeting]]
target = "purchase.product-discount.run"
input_query = "src/run.graphql"
export = "defaultFn"

[extensions.ui]
enable_create = false

[[extensions.metafields]]
namespace = "shopibundle"
key = "bundle_config"
