api_version = "2024-10"

[[extensions]]
name = "bundle-discount"
handle = "bundle-discount"

uid = "208e9edf-8b9b-6b74-3f3a-539fdede2328f859a084"

type = "function"
description = "Validates complete bundle presence in cart before applying discount"

[extensions.build]
command = ""
path = "src/index.ts"

[[extensions.targeting]]
target = "purchase.product-discount.run"
input_query = "src/run.graphql"
