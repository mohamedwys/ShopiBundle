api_version = "2026-01"

[[extensions]]
name = "bundle-discount"
handle = "bundle-discount"
type = "function"
description = "Validates complete bundle presence in cart before applying discount"

[extensions.build]
command = "npm run build"
path = "dist/function.js"
watch = ["src/**/*.ts"]

[[extensions.targeting]]
target = "purchase.product-discount.run"
input_query = "src/run.graphql"
export = "default"

[extensions.ui]
enable_create = false

[[extensions.metafields]]
namespace = "shopibundle"
key = "bundle_config"
